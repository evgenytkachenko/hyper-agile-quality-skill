[project]
name = "hyper-agile-quality-skill"
version = "0.1.0"
description = "Evidence-checked investigation of escaped defects using the Hyper-Agile Quality Loop"
readme = "README.md"
requires-python = ">=3.12"
# License: not yet chosen by the copyright holder. See docs/RELEASE-CHECKLIST.md.
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
haq = "haq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haq"]

[tool.hatch.build.targets.sdist]
include = ["src/haq", "tests", "skill", "docs", "README.md", "VENDORED.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
