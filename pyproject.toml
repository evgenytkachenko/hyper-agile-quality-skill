[project]
name = "hyper-agile-quality-skill"
version = "0.1.0b0"
description = "Evidence-checked investigation of escaped defects using the Hyper-Agile Quality Loop"
readme = "README.md"
requires-python = ">=3.12"
# The project's own code, documentation and methodology files (including the files in
# src/haq/_engine/ and src/haq/_methodology/, see VENDORED.md) are MIT-licensed.
# Dependencies keep their own licenses.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evgeny Tkachenko" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
haq = "haq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haq"]

[tool.hatch.build.targets.sdist]
include = ["src/haq", "tests", "skill", "docs", "README.md", "VENDORED.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
